name: Verify Published ARROW
on:
  push:
    branches: [verify/relay-1-1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public release and beta return navigation
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://enterarrow.com';
          async function get(url) {
            let error;
            for(let attempt=0;attempt<3;attempt++){
              try {const response=await fetch(url,{signal:AbortSignal.timeout(25000),headers:{'cache-control':'no-cache'}});assert.equal(response.status,200,url+' status');return response;}
              catch(caught){error=caught;await new Promise(resolve=>setTimeout(resolve,1500));}
            }
            throw error;
          }
          const health=await (await get(base+'/health')).json();assert.equal(health.ok,true);
          const release=await (await get(base+'/release.json')).json();assert.equal(release.channel,'public');assert.equal(release.relay,'afa24f4fe38ef5a4ef36b05404bfeb76e89b0046');
          for(const route of ['/','/orbit/','/orbit/staff/','/relay/','/relay/login/','/relay/beta-access/','/waypoint/','/atlas/','/ravin/','/arrow-shell.js','/autoPlanner.js']){
            const response=await get(base+route);const text=await response.text();assert.ok(text.length>0,route+' body');console.log('OK '+route);
          }
          const home=await (await get(base+'/')).text();assert.match(home,/Request Beta access/);assert.match(home,/Open Beta site/);
          const beta=await (await get('https://link9060.github.io/Resonant-Relay/login/')).text();assert.match(beta,/Back to public ARROW/);
          const relay=await (await get(base+'/relay/')).text();assert.match(relay,/<title>Relay[^<]*1\\.1/);
          const betaHome=await (await get('https://link9060.github.io/Resonant-Relay/')).text();assert.match(betaHome,/<title>Relay[^<]*1\\.1/);
          const scripts=[...relay.matchAll(/<script[^>]+src="([^"]+)"/g)].map(match=>new URL(match[1].replaceAll('&amp;','&'),base).href);
          const bundles=await Promise.all(scripts.map(async url=>(await get(url)).text()));
          assert.ok(bundles.some(text=>text.includes('Brain dump')&&text.includes('Open draft in RAVIN')),'published RAVIN widget bundle');
          console.log('Relay 1.1 and refreshed RAVIN widget verified on public; beta title verified.');
          console.log('Public release verified: '+release.relay);
          NODE
